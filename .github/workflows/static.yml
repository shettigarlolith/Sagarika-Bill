# Deploys only the web app (public/) to GitHub Pages.
# Server code, Android files and business data are never published.
name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build site folder
        run: |
          mkdir -p _site
          cp -R public _site/public
          # Keep existing /public/... links working and send the site root to the app.
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=public/login.html"><title>Sagarika Bill</title><a href="public/login.html">Open Sagarika Bill</a>\n' > _site/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
