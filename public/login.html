<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sagarika Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-v2.css" />
    <script>
      function logoutUser() {
        sessionStorage.removeItem('sagarika_auth');
        sessionStorage.removeItem('sagarika_token');
        sessionStorage.removeItem('sagarika_user');
        sessionStorage.removeItem('sagarika_role');
        sessionStorage.removeItem('sagarika_bill_to');
        location.replace('login.html');
      }
    </script>
    <style>
      .login-wrap {
        max-width: 520px;
        min-height: 100dvh;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        padding-top: 24px;
        padding-bottom: 24px;
      }

      .login-wrap > .card {
        width: 100%;
      }

      .login-title {
        margin: 6px 0 0;
        color: #ec1c24;
      }

      .mode-switch {
        margin-top: 12px;
        display: flex;
        gap: 8px;
        justify-content: flex-end;
      }

      .admin-panel {
        margin-top: 16px;
        display: none;
      }

      .pending-list {
        margin-top: 10px;
        display: grid;
        gap: 8px;
      }

      .pending-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border: 1px solid #dce5ec;
        border-radius: 10px;
        padding: 10px;
        flex-wrap: wrap;
      }

      .user-row-main {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #244462;
        font-size: 13px;
      }

      .user-row-actions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
      }

      .mode-btn-active {
        background: linear-gradient(135deg, #0c7a6b, #1e927f);
        color: #fff;
      }

      .admin-branch-label {
        margin: 8px 0 0;
        color: #f28c28;
        font-family: 'Montserrat', sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.16em;
        display: none;
      }

      .password-tools {
        margin-top: 6px;
        display: flex;
        justify-content: flex-end;
      }

      #authStatus,
      #adminStatus {
        display: block;
        margin: 12px 0 0;
        min-height: 20px;
        font-size: 14px;
        font-weight: 700;
      }

      .password-toggle {
        border: 0;
        background: none;
        padding: 0;
        color: #f28c28;
        cursor: pointer;
        width: 24px;
        height: 24px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .password-toggle svg {
        width: 18px;
        height: 18px;
        display: block;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @media (max-width: 768px) {
        .login-wrap {
          min-height: 100dvh;
          padding-top: 16px;
          padding-bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="container login-wrap">
      <section class="card">
        <p class="kicker">Secure Access</p>
        <h1 id="pageTitle" class="login-title">Sagarika Login</h1>
        <p id="adminBranchLabel" class="admin-branch-label"></p>
        <form id="authForm" class="meta-grid">
          <label>
            Username
            <input type="text" id="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" id="password" autocomplete="current-password" required />
            <span class="password-tools">
              <button type="button" id="passwordToggleBtn" class="password-toggle" aria-label="View Password" title="View Password">
                <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path
                    d="M2 12C4.6 7.8 8 5.7 12 5.7C16 5.7 19.4 7.8 22 12C19.4 16.2 16 18.3 12 18.3C8 18.3 4.6 16.2 2 12Z"
                    stroke="currentColor"
                    stroke-width="1.8"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                  <circle cx="12" cy="12" r="3.1" stroke="currentColor" stroke-width="1.8" />
                </svg>
                <span class="sr-only">View Password</span>
              </button>
            </span>
          </label>
          <label id="confirmPasswordField" style="display: none">
            Re-type Password
            <input type="password" id="confirmPassword" autocomplete="new-password" />
          </label>
          <label id="billToField" style="display: none">
            Bill To
            <select id="billTo">
              <option value="" selected disabled>Select Bill To</option>
              <option value="SAGARA">SAGARA</option>
              <option value="PAKSHIKERE">PAKSHIKERE</option>
            </select>
          </label>
          <div class="submit-wrap">
            <button type="button" id="continueBtn" class="btn btn-secondary" style="display: none">Continue to App</button>
          </div>
        </form>
        <div class="mode-switch">
          <button type="submit" id="authSubmitBtn" class="btn btn-primary" form="authForm">Login</button>
          <button type="button" id="modeRegisterBtn" class="btn btn-secondary">Create User</button>
          <button type="button" id="logoutInlineBtn" class="btn btn-danger" onclick="logoutUser()" style="display: none">Logout</button>
        </div>
        <div class="submit-wrap">
          <button type="button" id="openAppBtn" class="btn btn-secondary" style="display: none">Open App</button>
        </div>
        <p id="authHint" style="margin: 8px 0 0; color: #5f7383; font-size: 13px">
          Admin and approved users can login.
        </p>
        <section id="adminPanel" class="admin-panel">
          <h2>User Management</h2>
          <p class="status" id="adminStatus"></p>
          <div id="adminUsersList" class="pending-list"></div>
          <div class="submit-wrap">
            <button type="button" id="refreshPendingBtn" class="btn btn-secondary">Refresh Users</button>
          </div>
        </section>
        <p id="authStatus" class="status"></p>
      </section>
    </main>

    <script src="config.js?v=20260307"></script>
    <script src="login.js"></script>
  </body>
</html>
