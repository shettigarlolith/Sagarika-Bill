<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sagarika Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-v2.css" />
    <style>
      .login-wrap {
        max-width: 420px;
        margin: 10vh auto 0;
      }

      .login-title {
        margin: 6px 0 0;
        color: #ec108d;
      }
    </style>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="container login-wrap">
      <section class="card">
        <p class="kicker">Secure Access</p>
        <h1 class="login-title">Sagarika Bill Login</h1>
        <form id="loginForm" class="meta-grid">
          <label>
            Username
            <input type="text" id="username" autocomplete="username" required />
          </label>
          <label>
            Password
            <input type="password" id="password" autocomplete="current-password" required />
          </label>
          <div class="submit-wrap">
            <button type="submit" class="btn btn-primary">Login</button>
          </div>
        </form>
        <p id="loginStatus" class="status"></p>
      </section>
    </main>

    <script src="login.js"></script>
  </body>
</html>
