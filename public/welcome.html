<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome | Sagarika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-v2.css" />
    <style>
      .welcome-container {
        max-width: 1120px;
      }

      .welcome-header {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 10px;
      }

      .welcome-grid {
        display: grid;
        grid-template-columns: 1.05fr 1fr;
        gap: 18px;
      }

      .welcome-card {
        border-radius: 24px;
        border: 1px solid var(--line);
        background:
          radial-gradient(circle at 18% 15%, rgba(236, 16, 141, 0.12), transparent 40%),
          radial-gradient(circle at 86% 20%, rgba(12, 122, 107, 0.12), transparent 35%),
          var(--card);
        box-shadow: var(--shadow);
      }

      .brand-hero {
        min-height: 460px;
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        gap: 14px;
        padding: 28px;
      }

      .hero-logo-wrap {
        width: 172px;
        height: 172px;
        border-radius: 50%;
        padding: 20px;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, rgba(236, 16, 141, 0.16), rgba(12, 122, 107, 0.18));
        box-shadow: 0 12px 28px rgba(18, 38, 56, 0.2);
      }

      .hero-logo {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      .hero-title {
        margin: 0;
        font-family: 'Montserrat', sans-serif;
        letter-spacing: 0.12em;
        color: #ec1c24;
      }

      .hero-subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 15px;
        font-weight: 700;
      }

      .hero-actions {
        margin-top: 12px;
        width: min(460px, 100%);
        display: grid;
        gap: 12px;
      }

      .center-action {
        display: flex;
        justify-content: center;
      }

      .report-action .action-btn {
        width: calc(50% - 5px);
        min-height: 58px;
        font-size: 16px;
        color: #ffffff;
        border: 1px solid transparent;
        background: linear-gradient(135deg, #ab3564 0%, #c33c72 100%);
        box-shadow: 0 12px 24px rgba(195, 60, 114, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .down-action {
        margin-top: 8px;
      }

      .full-width-action .action-btn {
        width: 100%;
      }

      .main-actions {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .action-btn {
        min-height: 58px;
        border-radius: 14px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        text-decoration: none;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: 0.01em;
        border: 1px solid transparent;
        transition: transform 0.16s ease, box-shadow 0.16s ease, filter 0.16s ease;
      }

      .action-btn:hover {
        transform: translateY(-2px) scale(1.01);
        filter: saturate(1.08);
      }

      .action-btn-primary {
        color: #fff;
        background: linear-gradient(135deg, #d31b50 0%, #ec1c24 100%);
        box-shadow: 0 12px 24px rgba(211, 27, 80, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .action-btn-secondary {
        color: #fff;
        background: linear-gradient(135deg, #007f5f 0%, #00a14b 100%);
        box-shadow: 0 12px 24px rgba(0, 127, 95, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.18);
      }

      .action-btn-muted {
        color: #4a5f72;
        background: linear-gradient(180deg, #f6f9fc 0%, #e9f0f6 100%);
        border: 1px solid #cfdae6;
        min-height: 44px;
        font-size: 14px;
        box-shadow: 0 8px 16px rgba(24, 48, 67, 0.1);
      }

      [data-theme='dark'] .action-btn-muted {
        color: #d8e4ef;
        background: linear-gradient(180deg, #2a3b4d 0%, #223242 100%);
        border-color: #3b5063;
        box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
      }

      .calendar-shell {
        padding: 18px;
      }

      .calendar-head {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        flex-wrap: wrap;
      }

      .calendar-title {
        margin: 0;
        color: #ec1c24;
        font-size: 21px;
      }

      .month-label {
        font-weight: 800;
        min-width: 160px;
        text-align: center;
      }

      .calendar-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        flex-wrap: wrap;
      }

      .mini-btn {
        border: 1px solid var(--line);
        background: var(--input-bg);
        color: var(--text);
        border-radius: 10px;
        min-width: 42px;
        min-height: 38px;
        padding: 6px 12px;
        font-size: 22px;
        line-height: 1;
        font-weight: 900;
        cursor: pointer;
      }

      .calendar-weekdays,
      .calendar-grid {
        margin-top: 10px;
        display: grid;
        grid-template-columns: repeat(7, minmax(0, 1fr));
        gap: 8px;
      }

      .calendar-weekdays div {
        text-align: center;
        font-size: 11px;
        font-weight: 800;
        color: var(--muted);
      }

      .cal-day {
        min-height: 70px;
        border-radius: 11px;
        border: 1px solid var(--line);
        background: var(--input-bg);
        padding: 6px;
        text-align: center;
        color: var(--text);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .cal-day:hover {
        border-color: #ec1c24;
      }

      .cal-day-empty {
        border-style: dashed;
        opacity: 0.45;
        cursor: default;
      }

      .cal-day-today {
        background: #d9e1eb;
      }

      [data-theme='dark'] .cal-day-today {
        background: #4c5968;
      }

      .cal-day-selected {
        background: #ffdff0;
        border-color: #ec1c24;
      }

      .cal-day-num {
        font-size: clamp(16px, 2.1vw, 20px);
        font-weight: 900;
        line-height: 1;
        position: absolute;
        top: 7px;
        right: 7px;
      }

      [data-theme='dark'] .cal-day-num {
        color: #ffffff;
      }

      .cal-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #ec1c24;
        position: absolute;
        top: 7px;
        left: 7px;
      }

      .cal-booking-count {
        font-size: clamp(20px, 2.5vw, 34px);
        font-weight: 900;
        line-height: 1;
        color: #7a8794;
        position: relative;
        top: 10px;
      }

      .selected-panel {
        margin-top: 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--input-bg);
        padding: 12px;
        min-height: 112px;
      }

      .selected-panel h3 {
        margin: 0 0 8px;
        color: var(--text);
      }

      .booking-pill {
        display: inline-flex;
        margin: 0 8px 8px 0;
        padding: 6px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #f3f7fb;
        color: #1f3346;
        font-size: 12px;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.14s ease;
      }

      .booking-pill:hover {
        transform: translateY(-1px);
      }

      .booking-modal {
        position: fixed;
        inset: 0;
        z-index: 1200;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 20, 32, 0.65);
        padding: 16px;
      }

      .booking-modal[aria-hidden='false'] {
        display: flex;
      }

      .booking-modal-card {
        width: min(560px, 100%);
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--card);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .booking-modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }

      .booking-modal-head h3 {
        margin: 0;
        color: #ec1c24;
      }

      .booking-modal-close {
        border: 1px solid var(--line);
        background: var(--input-bg);
        color: var(--text);
        border-radius: 8px;
        font-size: 13px;
        font-weight: 800;
        padding: 6px 9px;
        cursor: pointer;
      }

      .booking-modal-body {
        margin-top: 12px;
        display: grid;
        gap: 8px;
        color: var(--text);
        font-size: 14px;
      }

      .booking-items-list {
        margin: 0;
        padding-left: 18px;
      }

      .booking-items-list li {
        margin: 4px 0;
      }

      .calendar-status {
        margin-top: 8px;
        min-height: 20px;
        font-size: 13px;
        color: var(--muted);
        font-weight: 700;
      }

      @media (max-width: 980px) {
        .welcome-grid {
          grid-template-columns: 1fr;
        }

        .brand-hero {
          min-height: 390px;
        }
      }

      @media (max-width: 560px) {
        .hero-actions {
          width: 100%;
          display: grid;
          gap: 10px;
        }

        .main-actions {
          display: grid;
          grid-template-columns: repeat(2, minmax(0, 1fr));
          gap: 8px;
        }

        .main-actions .action-btn,
        .report-action .action-btn,
        .full-width-action .action-btn {
          min-height: 38px;
          padding: 8px 6px;
          font-size: 12px;
          border-radius: 10px;
          white-space: nowrap;
        }

        .report-action .action-btn {
          width: calc(50% - 4px);
        }

        .full-width-action .action-btn {
          width: 100%;
        }

        .calendar-grid {
          gap: 6px;
        }

        .cal-day {
          min-height: 62px;
          padding: 6px;
        }
      }
    </style>
    <script>
      (function () {
        if (sessionStorage.getItem('sagarika_auth') === 'ok') return;
        const page = location.pathname.split('/').pop() || 'welcome.html';
        location.replace(`login.html?next=${encodeURIComponent(page)}`);
      })();

      function logoutUser() {
        sessionStorage.removeItem('sagarika_auth');
        sessionStorage.removeItem('sagarika_token');
        sessionStorage.removeItem('sagarika_user');
        sessionStorage.removeItem('sagarika_role');
        location.replace('login.html');
      }
    </script>
  </head>
  <body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <main class="container welcome-container">
      <section class="welcome-header">
        <label class="theme-toggle" for="themeToggle">
          <input id="themeToggle" type="checkbox" />
          <span>Night Mode</span>
        </label>
        <button class="btn btn-danger" type="button" onclick="logoutUser()">Logout</button>
      </section>

      <section class="welcome-grid">
        <article class="card welcome-card brand-hero">
          <div class="hero-logo-wrap">
            <img class="hero-logo" src="assets/sagarika-logo.svg" alt="Sagarika Logo" />
          </div>
          <h1 class="hero-title">SAGARIKA</h1>
          <p class="hero-subtitle">One place for all the details.</p>

          <div class="hero-actions">
            <div class="main-actions">
              <a class="action-btn action-btn-primary" href="book-event.html">Book Event</a>
              <a class="action-btn action-btn-secondary" href="index.html">Bill Desk</a>
            </div>
            <div class="center-action report-action">
              <a class="action-btn action-btn-muted" href="report.html">Report</a>
            </div>
            <div class="center-action down-action full-width-action">
              <a class="action-btn action-btn-muted" href="items.html">Item List</a>
            </div>
          </div>
        </article>

        <article class="card welcome-card calendar-shell">
          <div class="calendar-head">
            <h2 class="calendar-title">CALENDER</h2>
            <div class="calendar-nav">
              <button type="button" id="prevMonthBtn" class="mini-btn">&lt;</button>
              <strong id="monthLabel" class="month-label"></strong>
              <button type="button" id="nextMonthBtn" class="mini-btn">&gt;</button>
            </div>
          </div>

          <div class="calendar-weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
          </div>

          <div id="calendarGrid" class="calendar-grid"></div>
          <div id="calendarStatus" class="calendar-status">Loading bookings...</div>

          <div id="selectedPanel" class="selected-panel">
            <h3>Select a date</h3>
            <p style="margin: 0; color: var(--muted)">Click any day in the calendar to view booked events.</p>
          </div>
        </article>
      </section>
    </main>

    <section id="bookingModal" class="booking-modal" aria-hidden="true">
      <div class="booking-modal-card">
        <div class="booking-modal-head">
          <h3>Booked Details</h3>
          <button type="button" id="bookingModalClose" class="booking-modal-close">Close</button>
        </div>
        <div id="bookingModalContent" class="booking-modal-body"></div>
      </div>
    </section>

    <script src="config.js"></script>
    <script>
      const THEME_STORAGE_KEY = 'sagarika_theme_v1';
      const themeToggleInput = document.getElementById('themeToggle');
      const calendarGrid = document.getElementById('calendarGrid');
      const calendarStatus = document.getElementById('calendarStatus');
      const monthLabel = document.getElementById('monthLabel');
      const selectedPanel = document.getElementById('selectedPanel');
      const prevMonthBtn = document.getElementById('prevMonthBtn');
      const nextMonthBtn = document.getElementById('nextMonthBtn');
      const bookingModal = document.getElementById('bookingModal');
      const bookingModalClose = document.getElementById('bookingModalClose');
      const bookingModalContent = document.getElementById('bookingModalContent');
      const BACKEND_BASE_URL = String(window.SAGARIKA_BACKEND_URL || '').trim().replace(/\/+$/, '');

      let calendarMonthCursor = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
      let selectedDateKey = new Date().toISOString().slice(0, 10);
      let bookingMap = new Map();

      function applyTheme(theme) {
        const normalized = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', normalized);
        themeToggleInput.checked = normalized === 'dark';
        try {
          localStorage.setItem(THEME_STORAGE_KEY, normalized);
        } catch {
          // Ignore storage errors.
        }
      }

      function withApiBase(path) {
        if (!path.startsWith('/api/') || !BACKEND_BASE_URL) {
          return path;
        }
        return `${BACKEND_BASE_URL}${path}`;
      }

      async function parseJsonResponse(response) {
        const text = await response.text();
        try {
          return JSON.parse(text);
        } catch {
          throw new Error('Server returned invalid JSON for calendar data.');
        }
      }

      async function requestApiJson(paths) {
        const resources = Array.isArray(paths) ? paths : [paths];
        let lastError = new Error('Failed to load calendar data.');

        for (const resource of resources) {
          try {
            const response = await fetch(withApiBase(`/api/${resource}`));
            const data = await parseJsonResponse(response);
            if (!response.ok) {
              throw new Error(data.error || `Request failed (HTTP ${response.status}).`);
            }
            return data;
          } catch (error) {
            lastError = error;
          }
        }

        throw lastError;
      }

      function asArrayPayload(data) {
        if (Array.isArray(data)) return data;
        if (Array.isArray(data?.data)) return data.data;
        if (Array.isArray(data?.rows)) return data.rows;
        return [];
      }

      function monthTitle(dateObj) {
        return dateObj.toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
      }

      function toDateKey(year, monthIndex, day) {
        return `${year}-${String(monthIndex + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      function getBookingDateKey(raw) {
        if (!raw) return '';
        const text = String(raw).trim();
        if (/^\d{4}-\d{2}-\d{2}$/.test(text)) return text;
        const d = new Date(text);
        if (Number.isNaN(d.getTime())) return '';
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function showSelectedDayDetails() {
        const entries = bookingMap.get(selectedDateKey) || [];
        const formatted = new Date(`${selectedDateKey}T00:00:00`).toLocaleDateString('en-US', {
          weekday: 'long',
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        });

        if (entries.length === 0) {
          selectedPanel.innerHTML = `<h3>${formatted}</h3><p style="margin:0;color:var(--muted)">No bookings for this date.</p>`;
          return;
        }

        const pills = entries
          .map((entry, index) => {
            const label = String(entry.name || entry.event || entry.eventName || entry.bookingId || 'Booked Event');
            return `<button type="button" class="booking-pill" data-booking-index="${index}">${escapeHtml(label)}</button>`;
          })
          .join('');

        selectedPanel.innerHTML = `
          <h3>${formatted}</h3>
          <p style="margin:0 0 8px;color:var(--muted)">${entries.length} booking(s)</p>
          <div>${pills}</div>
        `;

        selectedPanel.querySelectorAll('[data-booking-index]').forEach((button) => {
          button.addEventListener('click', () => {
            const index = Number(button.getAttribute('data-booking-index'));
            if (!Number.isFinite(index) || !entries[index]) return;
            openBookingModal(entries[index]);
          });
        });
      }

      function renderBookingItems(items) {
        if (!Array.isArray(items) || items.length === 0) {
          return '<p style="margin:0;"><strong>Items:</strong> No items listed.</p>';
        }

        const rows = items
          .map((entry) => {
            const itemName = String(entry?.item || '').trim();
            const quantity = Number(entry?.quantity);
            if (!itemName || !Number.isFinite(quantity) || quantity <= 0) {
              return '';
            }
            return `<li>${escapeHtml(itemName)} - Qty: ${escapeHtml(quantity)}</li>`;
          })
          .filter(Boolean)
          .join('');

        if (!rows) {
          return '<p style="margin:0;"><strong>Items:</strong> No items listed.</p>';
        }

        return `<div><strong>Items:</strong><ul class="booking-items-list">${rows}</ul></div>`;
      }

      function openBookingModal(booking) {
        const bookingDate = escapeHtml(getBookingDateKey(booking.eventDay || booking.eventDate || booking.date) || '-');
        const bookingId = escapeHtml(booking.bookingId || '-');
        const eventName = escapeHtml(booking.event || booking.eventName || '-');
        const customerName = escapeHtml(booking.name || booking.customerName || '-');
        const phone = escapeHtml(booking.phoneNumber || '-');
        const address = escapeHtml(booking.address || '-');
        const note = escapeHtmlWithLineBreaks(booking.note || '-');

        bookingModalContent.innerHTML = `
          <p style="margin:0;"><strong>Booking ID:</strong> ${bookingId}</p>
          <p style="margin:0;"><strong>Date:</strong> ${bookingDate}</p>
          <p style="margin:0;"><strong>Event:</strong> ${eventName}</p>
          <p style="margin:0;"><strong>Name:</strong> ${customerName}</p>
          <p style="margin:0;"><strong>Phone:</strong> ${phone}</p>
          <p style="margin:0;"><strong>Address:</strong> ${address}</p>
          ${renderBookingItems(booking.items)}
          <p style="margin:0;"><strong>Note:</strong> ${note}</p>
        `;

        bookingModal.setAttribute('aria-hidden', 'false');
      }

      function closeBookingModal() {
        bookingModal.setAttribute('aria-hidden', 'true');
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeHtmlWithLineBreaks(value) {
        return escapeHtml(value).replace(/\r?\n/g, '<br>');
      }

      function renderCalendar() {
        const monthStart = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth(), 1);
        const year = monthStart.getFullYear();
        const month = monthStart.getMonth();
        const firstWeekIndex = monthStart.getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const todayKey = new Date().toISOString().slice(0, 10);

        monthLabel.textContent = monthTitle(monthStart);
        calendarGrid.innerHTML = '';

        for (let i = 0; i < firstWeekIndex; i += 1) {
          const empty = document.createElement('div');
          empty.className = 'cal-day cal-day-empty';
          calendarGrid.appendChild(empty);
        }

        for (let day = 1; day <= daysInMonth; day += 1) {
          const key = toDateKey(year, month, day);
          const count = (bookingMap.get(key) || []).length;

          const dayBtn = document.createElement('button');
          dayBtn.type = 'button';
          dayBtn.className = 'cal-day';

          if (key === todayKey) {
            dayBtn.classList.add('cal-day-today');
          }
          if (key === selectedDateKey) {
            dayBtn.classList.add('cal-day-selected');
          }

          dayBtn.innerHTML = `
            <div class="cal-day-num">${day}</div>
            ${count > 0 ? '<div class="cal-booking-count">' + count + '</div><span class="cal-dot"></span>' : ''}
          `;

          dayBtn.addEventListener('click', () => {
            selectedDateKey = key;
            renderCalendar();
            showSelectedDayDetails();
          });

          calendarGrid.appendChild(dayBtn);
        }
      }

      async function loadBookings() {
        calendarStatus.textContent = 'Loading bookings...';
        calendarStatus.style.color = 'var(--muted)';

        try {
          const data = await requestApiJson(['book-events', 'bookEvents', 'bookevent']);
          const rows = asArrayPayload(data);
          bookingMap = new Map();

          rows.forEach((booking) => {
            const key = getBookingDateKey(booking.eventDay || booking.eventDate || booking.date);
            if (!key) return;
            const bucket = bookingMap.get(key) || [];
            bucket.push(booking);
            bookingMap.set(key, bucket);
          });

          calendarStatus.textContent = `${rows.length} booking record(s) loaded.`;
          renderCalendar();
          showSelectedDayDetails();
        } catch (error) {
          calendarStatus.textContent = error.message || 'Failed to load bookings.';
          calendarStatus.style.color = '#b42a2a';
          renderCalendar();
          showSelectedDayDetails();
        }
      }

      prevMonthBtn.addEventListener('click', () => {
        calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() - 1, 1);
        renderCalendar();
      });

      nextMonthBtn.addEventListener('click', () => {
        calendarMonthCursor = new Date(calendarMonthCursor.getFullYear(), calendarMonthCursor.getMonth() + 1, 1);
        renderCalendar();
      });

      bookingModalClose.addEventListener('click', closeBookingModal);

      bookingModal.addEventListener('click', (event) => {
        if (event.target === bookingModal) {
          closeBookingModal();
        }
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && bookingModal.getAttribute('aria-hidden') === 'false') {
          closeBookingModal();
        }
      });

      themeToggleInput.addEventListener('change', () => {
        applyTheme(themeToggleInput.checked ? 'dark' : 'light');
      });

      window.addEventListener('storage', (event) => {
        if (event.key === THEME_STORAGE_KEY) {
          applyTheme(event.newValue === 'dark' ? 'dark' : 'light');
        }
      });

      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
      } catch {
        applyTheme('light');
      }

      renderCalendar();
      loadBookings();
    </script>
  </body>
</html>
