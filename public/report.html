<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Report | Sagarika</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Montserrat:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles-v2.css?v=20261122-print" />
    <style>
      .report-heading {
        display: grid;
        align-content: start;
        gap: 8px;
      }

      .report-main-center {
        width: min(1080px, 100%);
      }

      .report-home-btn {
        align-self: flex-start;
        width: auto;
        min-width: 0;
        display: inline-flex;
        flex: 0 0 auto;
        background: #7ed957;
        color: #0f3a1f;
        border: 1px solid #67bf43;
      }

      .report-home-btn:hover {
        background: #72cf4d;
      }

      .report-top-actions {
        display: inline-flex;
        align-items: center;
        gap: 10px;
      }

      .report-power-btn {
        min-width: 38px;
        min-height: 36px;
        padding: 8px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }

      .report-power-btn svg {
        width: 16px;
        height: 16px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
      }

      .report-actions {
        margin-top: 14px;
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .report-action-btn {
        min-height: 56px;
        font-size: 16px;
      }

      .report-status {
        margin-top: 12px;
        min-height: 20px;
        font-weight: 700;
      }

      .report-toolbar {
        margin-top: 10px;
        display: flex;
        justify-content: flex-end;
      }

      .report-table-wrap {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: auto;
        background: var(--input-bg);
      }

      .report-table {
        width: 100%;
        min-width: 720px;
        border-collapse: collapse;
      }

      .report-table th,
      .report-table td {
        border: 1px solid var(--line);
        padding: 10px 12px;
        text-align: left;
      }

      .report-table th {
        background: var(--table-head);
        color: var(--table-head-text);
        font-size: 13px;
      }

      .report-table tr.duplicate-row td {
        background: var(--dup-bg, #ffd9d9);
        color: #111111;
        font-weight: 700;
      }

      .date-modal {
        position: fixed;
        inset: 0;
        z-index: 1200;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(10, 20, 32, 0.65);
        padding: 16px;
      }

      .date-modal[aria-hidden='false'] {
        display: flex;
      }

      .date-modal-card {
        width: min(96vw, 420px);
        border-radius: 14px;
        border: 1px solid var(--line);
        background: var(--card);
        box-shadow: var(--shadow);
        padding: 16px;
      }

      .date-modal-card h3 {
        margin: 0 0 10px;
      }

      .date-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .date-grid label.date-grid-full {
        grid-column: 1 / -1;
      }

      .date-modal-actions {
        margin-top: 14px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
        flex-wrap: wrap;
      }

      .print-sheet {
        display: none;
      }

      .print-heading {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: 900;
        color: #111;
      }

      @media print {
        body * {
          visibility: hidden !important;
        }

        .print-sheet,
        .print-sheet * {
          visibility: visible !important;
        }

        .print-sheet {
          display: block !important;
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          background: #fff !important;
          color: #111 !important;
          padding: 8mm;
          -webkit-print-color-adjust: exact;
          print-color-adjust: exact;
        }

        .print-heading {
          display: block !important;
        }

        .print-table-wrap {
          display: block !important;
          margin-top: 0 !important;
          border: none !important;
          border-radius: 0 !important;
          overflow: visible !important;
          background: #fff !important;
        }

        .print-sheet .report-table {
          min-width: 0 !important;
          width: 100% !important;
        }

        .print-sheet .report-table th,
        .print-sheet .report-table td {
          border: 1px solid #111 !important;
          color: #111 !important;
        }
      }

      @media (max-width: 700px) {
        .report-main-center {
          min-height: calc(100vh - 24px);
          margin: 12px auto;
          padding: 0 12px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .report-main-center > .card {
          width: 100%;
          max-width: 560px;
        }

        .card .title-row {
          flex-direction: row;
          align-items: center;
          justify-content: space-between;
          gap: 10px;
        }

        .card .report-heading {
          min-width: 0;
          flex: 1 1 auto;
        }

        .card .report-top-actions {
          margin-left: 0;
          width: auto;
          justify-content: flex-end;
          gap: 8px;
          flex-wrap: nowrap;
        }

        .card .report-top-actions .btn {
          min-height: 36px;
          padding: 8px 12px;
        }

        .card .report-home-btn {
          margin-top: 2px;
          min-height: 34px;
          padding: 7px 11px;
          width: fit-content;
          max-width: max-content;
        }

        .card .report-top-actions .theme-toggle span {
          display: none;
        }

        .report-actions {
          grid-template-columns: 1fr;
        }

        .date-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
    <script>
      (function () {
        if (sessionStorage.getItem('sagarika_auth') === 'ok' && sessionStorage.getItem('sagarika_token')) return;
        sessionStorage.removeItem('sagarika_auth');
        sessionStorage.removeItem('sagarika_token');
        sessionStorage.removeItem('sagarika_user');
        sessionStorage.removeItem('sagarika_role');
        sessionStorage.removeItem('sagarika_bill_to');
        const page = location.pathname.split('/').pop() || 'report.html';
        location.replace(`login.html?next=${encodeURIComponent(page)}`);
      })();

      function logoutUser() {
        sessionStorage.removeItem('sagarika_auth');
        sessionStorage.removeItem('sagarika_token');
        sessionStorage.removeItem('sagarika_user');
        sessionStorage.removeItem('sagarika_role');
        sessionStorage.removeItem('sagarika_bill_to');
        location.replace('login.html');
      }
    </script>

    <div class="bg-shape shape-2"></div>

    <main class="container report-main-center">
      <section class="card">
        <div class="title-row">
          <div class="report-heading">
            <p class="kicker">Analytics</p>
            <h1 class="page-title">
              <span
                class="title-logo logo-animation"

              <span>Report</span>
            </h1>
            <a class="btn btn-secondary report-home-btn" href="welcome.html">Home</a>
          </div>
          <div class="title-right-actions report-top-actions">
            <label class="theme-toggle" for="themeToggle">

            <button class="btn btn-danger report-power-btn" type="button" onclick="logoutUser()" aria-label="Logout" title="Logout">

    <script>
      const THEME_STORAGE_KEY = 'sagarika_theme_v1';
      const themeToggleInput = document.getElementById('themeToggle');
      const bookingReportBtn = document.getElementById('bookingReportBtn');
      const billingReportBtn = document.getElementById('billingReportBtn');
      const reportStatus = document.getElementById('reportStatus');
      const bookingReportWrap = document.getElementById('bookingReportWrap');
      const bookingReportBody = document.getElementById('bookingReportBody');
      const billingReportWrap = document.getElementById('billingReportWrap');
      const billingReportBody = document.getElementById('billingReportBody');
      const reportToolbar = document.getElementById('reportToolbar');
      const printBookingReportBtn = document.getElementById('printBookingReportBtn');
      const printHeading = document.getElementById('printHeading');
      const printContent = document.getElementById('printContent');
      const periodChips = document.getElementById('periodChips');
      const billModeChips = document.getElementById('billModeChips');
      const customRange = document.getElementById('customRange');
      const periodLabel = document.getElementById('periodLabel');
      const reportStats = document.getElementById('reportStats');
      const fromDateInput = document.getElementById('fromDateInput');
      const toDateInput = document.getElementById('toDateInput');
      const applyDateRangeBtn = document.getElementById('applyDateRangeBtn');
      const BACKEND_BASE_URL = String(window.SAGARIKA_BACKEND_URL || '').trim().replace(/\/+$/, '');
      let bookingReportRange = { from: '', to: '' };
      let activeReportType = '';
      let activeBillingMode = 'with-gst';
      let activeTab = 'billing';
      let activePeriod = 'month';
      const dataCache = {};
      const CACHE_MS = 60 * 1000;
      let reportRun = 0;
      const money = new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });

      function formatBillingModeLabel(mode) {
        return String(mode || '').trim().toLowerCase() === 'no-gst' ? 'No GST' : 'With GST';
      }

      function withApiBase(path) {
        if (!path.startsWith('/api/') || !BACKEND_BASE_URL) return path;
        return `${BACKEND_BASE_URL}${path}`;
      }

      function getAuthToken() {
        return String(sessionStorage.getItem('sagarika_token') || '').trim();
      }

      function authFetch(path, options = {}) {
        const nextOptions = { ...options };
        const headers = { ...(nextOptions.headers || {}) };
        const token = getAuthToken();
        if (token) {
          headers.Authorization = `Bearer ${token}`;
        }
        nextOptions.headers = headers;
        if (typeof navigator !== 'undefined' && navigator.onLine === false) {
          if (window.showConnectionLostPopup) {
            window.showConnectionLostPopup();
          }
          return Promise.reject(new Error('Connection lost. Please refresh.'));
        }
        return fetch(withApiBase(path), nextOptions).catch((error) => {
          if (window.handleConnectionProblem && window.handleConnectionProblem(error)) {
            throw new Error('Connection lost. Please refresh.');
          }
          throw error;
        });
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function normalizeDateKey(value) {
        const raw = String(value || '').trim();
        if (!raw) return '';
        if (/^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0, 10);
        const dmy = raw.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})/);
        if (dmy) return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
        const d = new Date(raw);
        if (Number.isNaN(d.getTime())) return '';
        const yyyy = String(d.getFullYear()).padStart(4, '0');
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        return `${yyyy}-${mm}-${dd}`;
      }

      function formatDateDisplay(value) {
        const key = normalizeDateKey(value);
        if (!key) return '-';
        const [yyyy, mm, dd] = key.split('-');
        return `${dd}/${mm}/${String(yyyy).slice(-2)}`;
      }

      function formatMoney(value) {
        const n = Number(value || 0);
        if (!Number.isFinite(n)) return '0.00';
        return n.toFixed(2);
      }

      function normalizePhone(value) {
        return String(value || '').replace(/\D/g, '');
      }

      function buildItemSignature(row) {
        const tokensFromItems = (() => {
          const items = Array.isArray(row?.items) ? row.items : [];
          return items
            .map((entry) => {
              const itemName = String(entry?.item || '').trim().toLowerCase().replace(/\s+/g, ' ');
              const qtyRaw = Number(entry?.quantity ?? 0);
              const qty = Number.isFinite(qtyRaw) ? qtyRaw.toFixed(3) : '0.000';
              return itemName ? `${itemName}:${qty}` : '';
            })
            .filter(Boolean);
        })();

        const tokensFromSelected = (() => {
          const selected = String(row?.selectedItems || '').trim();
          if (!selected) return [];
          return selected
            .split(',')
            .map((part) => {
              const text = String(part || '').trim().toLowerCase().replace(/\s+/g, ' ');
              if (!text) return '';
              const match = text.match(/^(.*)\sx\s(-?\d+(?:\.\d+)?)$/);
              if (match) {
                const itemName = String(match[1] || '').trim();
                const qtyRaw = Number(match[2]);
                const qty = Number.isFinite(qtyRaw) ? qtyRaw.toFixed(3) : '0.000';
                return itemName ? `${itemName}:${qty}` : '';
              }
              return text;
            })
            .filter(Boolean);
        })();

        const tokens = tokensFromSelected.length > 0 ? tokensFromSelected : tokensFromItems;
        if (tokens.length === 0) return '';
        return [...tokens].sort().join('|');
      }

      function duplicateKeyForBill(row) {
        const phone = normalizePhone(row.phoneNumber);
        const customer = String(row.customerName || '').trim().toLowerCase();
        const itemSignature = buildItemSignature(row);
        const total = formatMoney(row.total || 0);
        const payable = formatMoney(row.amountPayable || 0);
        return [phone, customer, itemSignature, total, payable].join('|');
      }

      function billIdSequence(value) {
        const raw = String(value || '').trim();
        const match = raw.match(/(\d+)/);
        if (!match) return Number.MAX_SAFE_INTEGER;
        const n = Number(match[1]);
        return Number.isFinite(n) ? n : Number.MAX_SAFE_INTEGER;
      }

      async function parseJsonResponse(response) {
        const raw = await response.text();
        try {
          return JSON.parse(raw);
        } catch {
          throw new Error('Invalid JSON from backend.');
        }
      }

      function localDateKey(d) {
        return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
      }

      function periodRange(period) {
        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        if (period === 'today') {
          const key = localDateKey(now);
          return { from: key, to: key };
        }
        if (period === 'week') {
          const mondayOffset = (now.getDay() + 6) % 7;
          const start = new Date(y, m, now.getDate() - mondayOffset);
          const end = new Date(y, m, now.getDate() - mondayOffset + 6);
          return { from: localDateKey(start), to: localDateKey(end) };
        }
        if (period === 'last-month') {
          return { from: localDateKey(new Date(y, m - 1, 1)), to: localDateKey(new Date(y, m, 0)) };
        }
        if (period === 'custom') {
          return { from: String(fromDateInput.value || '').trim(), to: String(toDateInput.value || '').trim() };
        }
        return { from: localDateKey(new Date(y, m, 1)), to: localDateKey(new Date(y, m + 1, 0)) };
      }

      function prettyDate(key, withYear) {
        const [y, mo, d] = key.split('-').map(Number);
        return new Date(y, mo - 1, d).toLocaleDateString('en-IN', withYear ? { day: 'numeric', month: 'short', year: 'numeric' } : { day: 'numeric', month: 'short' });
      }

      function prettyRange(from, to) {
        if (from === to) return prettyDate(from, true);
        return `${prettyDate(from, from.slice(0, 4) !== to.slice(0, 4))} – ${prettyDate(to, true)}`;
      }

      function renderStats(cards) {
        reportStats.innerHTML = cards
          .map(
            (card) => `
              <article class="dash-stat report-stat-${card.tone || 'primary'}">
                <p class="dash-stat-label">${escapeHtml(card.label)}</p>
                <p class="dash-stat-value">${escapeHtml(card.value)}</p>
                <p class="dash-stat-note">${card.note || '&nbsp;'}</p>
              </article>
            `
          )
          .join('');
      }

      function renderLoadingStats() {
        reportStats.innerHTML = Array.from({ length: 4 })
          .map(() => '<article class="dash-stat is-loading"><p class="dash-stat-label">&nbsp;</p><p class="dash-stat-value">—</p><p class="dash-stat-note">&nbsp;</p></article>')
          .join('');
      }

      function billAmounts(row) {
        const total = Number(row.total || 0) || 0;
        const gstPercent = Number(row.gst || 0) || 0;
        const discountPercent = Number(row.discount || 0) || 0;
        const gstAmount = (total * gstPercent) / 100;
        const discountAmount = (total * discountPercent) / 100;
        const payable = Number(row.amountPayable || total + gstAmount - discountAmount) || 0;
        return { total, gstAmount, discountAmount, payable };
      }

      function renderBillingStats(rows, mode) {
        let sales = 0;
        let gst = 0;
        let discount = 0;
        let discountedBills = 0;
        let biggest = null;
        rows.forEach((row) => {
          const a = billAmounts(row);
          sales += a.payable;
          gst += a.gstAmount;
          discount += a.discountAmount;
          if (a.discountAmount > 0) discountedBills += 1;
          if (!biggest || a.payable > biggest.amount) biggest = { amount: a.payable, row };
        });
        const count = rows.length;
        const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;
        const third =
          mode === 'no-gst'
            ? {
                label: 'Biggest bill',
                value: biggest ? money.format(biggest.amount) : '—',
                note: biggest ? `Bill <strong>${escapeHtml(biggest.row.billId || '-')}</strong> · ${escapeHtml(biggest.row.customerName || 'No name')}` : 'No bills yet',
                tone: 'gold'
              }
            : {
                label: 'GST collected',
                value: money.format(gst),
                note: `SGST ${money.format(gst / 2)} · CGST ${money.format(gst / 2)}`,
                tone: 'gold'
              };
        renderStats([
          { label: 'Total sales', value: money.format(sales), note: `${plural(count, 'bill')} · ${formatBillingModeLabel(mode)}`, tone: 'primary' },
          { label: 'Bills', value: String(count), note: count ? `Average <strong>${money.format(sales / count)}</strong> per bill` : 'No bills in this period', tone: 'success' },
          third,
          { label: 'Discounts given', value: money.format(discount), note: discountedBills ? `On ${plural(discountedBills, 'bill')}` : 'No discounts', tone: 'accent' }
        ]);
      }

      function renderBookingStats(rows) {
        const todayKey = localDateKey(new Date());
        const upcoming = rows.filter((row) => normalizeDateKey(row.eventDay) >= todayKey);
        const next = upcoming[0];
        const byEvent = new Map();
        rows.forEach((row) => {
          const name = String(row.event || '').trim() || 'Other';
          byEvent.set(name, (byEvent.get(name) || 0) + 1);
        });
        const top = [...byEvent.entries()].sort((a, b) => b[1] - a[1])[0];
        const phones = rows.map((row) => normalizePhone(row.phoneNumber)).filter(Boolean);
        const uniquePhones = new Set(phones);
        const repeat = phones.length - uniquePhones.size;
        renderStats([
          { label: 'Bookings', value: String(rows.length), note: rows.length ? `${byEvent.size} event type${byEvent.size === 1 ? '' : 's'}` : 'No bookings in this period', tone: 'primary' },
          {
            label: 'Upcoming',
            value: String(upcoming.length),
            note: next ? `Next: <strong>${escapeHtml(next.name || next.event || next.bookingId)}</strong> · ${escapeHtml(prettyDate(normalizeDateKey(next.eventDay)))}` : 'Nothing coming up',
            tone: 'success'
          },
          { label: 'Most booked', value: top ? top[0] : '—', note: top ? `${top[1]} booking${top[1] === 1 ? '' : 's'}` : '&nbsp;', tone: 'gold' },
          { label: 'Customers', value: String(uniquePhones.size), note: repeat > 0 ? `${repeat} repeat booking${repeat === 1 ? '' : 's'}` : 'All different customers', tone: 'accent' }
        ]);
      }

      async function fetchCached(key, path) {
        const cached = dataCache[key];
        if (cached && Date.now() - cached.at < CACHE_MS) return cached.data;
        const response = await authFetch(path);
        const data = await parseJsonResponse(response);
        if (!response.ok) {
          throw new Error((data && (data.error || data.details)) || 'Failed to load report.');
        }
        if (!Array.isArray(data)) {
          throw new Error('Invalid report data.');
        }
        dataCache[key] = { data, at: Date.now() };
        return data;
      }

      function renderBookingReport(rows) {
        bookingReportBody.innerHTML = rows
          .map(
            (row, index) => `
              <tr>
                <td>${index + 1}</td>
                <td>${escapeHtml(formatDateDisplay(row.eventDay))}</td>
                <td>${escapeHtml(row.bookingId || '-')}</td>
                <td>${escapeHtml(row.event || '-')}</td>
                <td>${escapeHtml(row.name || '-')}</td>
                <td>${escapeHtml(row.phoneNumber || '-')}</td>
              </tr>
            `
          )
          .join('');
      }

      function renderBillingReport(rows) {
        const grouped = new Map();
        rows.forEach((row) => {
          const key = duplicateKeyForBill(row);
          const list = grouped.get(key) || [];
          list.push(row);
          grouped.set(key, list);
        });

        const duplicateBillIds = new Set();
        const duplicateColorByBillId = new Map();
        const duplicatePalette = ['#ffd9d9', '#ffe7c7', '#fff4b8', '#d9f5d6', '#d6ecff', '#eadbff', '#ffdff2', '#d7f7f2'];
        let duplicateGroupIndex = 0;
        grouped.forEach((list) => {
          const ids = new Set(list.map((row) => String(row.billId || '').trim()).filter(Boolean));
          if (ids.size > 1) {
            const color = duplicatePalette[duplicateGroupIndex % duplicatePalette.length];
            duplicateGroupIndex += 1;
            list.forEach((row) => duplicateBillIds.add(String(row.billId || '').trim()));
            list.forEach((row) => duplicateColorByBillId.set(String(row.billId || '').trim(), color));
          }
        });

        let totalTaxable = 0;
        let totalSgst = 0;
        let totalCgst = 0;
        let totalDiscountAmt = 0;
        let totalPayable = 0;

        const bodyRows = rows
          .map((row) => {
            const total = Number(row.total || 0);
            const gstPercent = Number(row.gst || 0);
            const discountPercent = Number(row.discount || 0);
            const gstAmount = (total * gstPercent) / 100;
            const sgst = gstAmount / 2;
            const cgst = gstAmount / 2;
            const discountAmount = (total * discountPercent) / 100;
            const payable = Number(row.amountPayable || total + gstAmount - discountAmount);

            totalTaxable += total;
            totalSgst += sgst;
            totalCgst += cgst;
            totalDiscountAmt += discountAmount;
            totalPayable += payable;
            const billId = String(row.billId || '').trim();
            const duplicateClass = duplicateBillIds.has(billId) ? 'duplicate-row' : '';
            const duplicateStyle = duplicateClass ? ` style="--dup-bg:${duplicateColorByBillId.get(billId)}"` : '';

            return `
              <tr class="${duplicateClass}"${duplicateStyle}>
                <td>${escapeHtml(row.billId || '-')}</td>
                <td>${escapeHtml(formatDateDisplay(row.billDate))}</td>
                <td>${escapeHtml(row.customerName || '-')}</td>
                <td>${escapeHtml(row.phoneNumber || '-')}</td>
                <td>${escapeHtml(row.gstNo || '-')}</td>
                <td>${formatMoney(total)}</td>
                <td>${formatMoney(gstPercent)}</td>
                <td>${formatMoney(sgst)}</td>
                <td>${formatMoney(cgst)}</td>
                <td>${formatMoney(discountPercent)}</td>
                <td>${formatMoney(discountAmount)}</td>
                <td>${formatMoney(payable)}</td>
              </tr>
            `;
          })
          .join('');

        const totalsRow = `
          <tr>
            <td colspan="5"><strong>Totals</strong></td>
            <td><strong>${formatMoney(totalTaxable)}</strong></td>
            <td></td>
            <td><strong>${formatMoney(totalSgst)}</strong></td>
            <td><strong>${formatMoney(totalCgst)}</strong></td>
            <td></td>
            <td><strong>${formatMoney(totalDiscountAmt)}</strong></td>
            <td><strong>${formatMoney(totalPayable)}</strong></td>
          </tr>
        `;

        billingReportBody.innerHTML = `${bodyRows}${totalsRow}`;
        return duplicateBillIds.size;
      }

      async function loadBookingReport(fromDate, toDate, run = reportRun) {
        reportStatus.textContent = 'Loading booking report...';
        reportStatus.style.color = 'var(--muted)';
        bookingReportWrap.style.display = 'none';
        billingReportWrap.style.display = 'none';

        const data = await fetchCached('bookings', '/api/book-events');
        if (run !== reportRun) return;

        const filtered = data
          .filter((row) => {
            const key = normalizeDateKey(row.eventDay);
            return key && key >= fromDate && key <= toDate;
          })
          .sort((a, b) => normalizeDateKey(a.eventDay).localeCompare(normalizeDateKey(b.eventDay)));

        renderBookingStats(filtered);
        if (filtered.length === 0) {
          reportStatus.textContent = `No bookings found from ${formatDateDisplay(fromDate)} to ${formatDateDisplay(toDate)}.`;
          reportStatus.style.color = '#b42a2a';
          bookingReportBody.innerHTML = '';
          reportToolbar.style.display = 'none';
          return;
        }

        renderBookingReport(filtered);
        bookingReportWrap.style.display = 'block';
        activeReportType = 'booking';
        reportToolbar.style.display = 'flex';
        bookingReportRange = { from: fromDate, to: toDate };
        printHeading.textContent = `Booking Report - From ${formatDateDisplay(fromDate)} Till ${formatDateDisplay(toDate)}`;
        reportStatus.textContent = `${filtered.length} booking record(s) from ${formatDateDisplay(fromDate)} to ${formatDateDisplay(toDate)}.`;
        reportStatus.style.color = '#4caf50';
      }

      async function loadBillingReport(fromDate, toDate, billingMode = 'with-gst', run = reportRun) {
        reportStatus.textContent = 'Loading billing report...';
        reportStatus.style.color = 'var(--muted)';
        bookingReportWrap.style.display = 'none';
        billingReportWrap.style.display = 'none';

        const normalizedBillingMode = String(billingMode || '').trim().toLowerCase() === 'no-gst' ? 'no-gst' : 'with-gst';
        activeBillingMode = normalizedBillingMode;
        const data = await fetchCached(`bills-${normalizedBillingMode}`, `/api/bills?billMode=${encodeURIComponent(normalizedBillingMode)}`);
        if (run !== reportRun) return;

        const filtered = data
          .filter((row) => {
            const key = normalizeDateKey(row.billDate);
            return key && key >= fromDate && key <= toDate;
          })
          .sort((a, b) => {
            const byBillNo = billIdSequence(a.billId) - billIdSequence(b.billId);
            if (byBillNo !== 0) return byBillNo;
            return String(a.billDate || '').localeCompare(String(b.billDate || ''));
          });

        renderBillingStats(filtered, normalizedBillingMode);
        if (filtered.length === 0) {
          reportStatus.textContent = `No ${formatBillingModeLabel(normalizedBillingMode)} bills found from ${formatDateDisplay(fromDate)} to ${formatDateDisplay(toDate)}.`;
          reportStatus.style.color = '#b42a2a';
          billingReportBody.innerHTML = '';
          reportToolbar.style.display = 'none';
          return;
        }

        const duplicateCount = renderBillingReport(filtered);
        billingReportWrap.style.display = 'block';
        activeReportType = 'billing';
        reportToolbar.style.display = 'flex';
        bookingReportRange = { from: fromDate, to: toDate };
        printHeading.textContent = `Billing Report (${formatBillingModeLabel(normalizedBillingMode)}) - From ${formatDateDisplay(fromDate)} Till ${formatDateDisplay(toDate)}`;
        const duplicateText =
          duplicateCount > 0 ? ` Possible duplicate bills highlighted: ${duplicateCount}.` : ' No duplicate bills detected.';
        reportStatus.textContent = `${filtered.length} ${formatBillingModeLabel(normalizedBillingMode)} bill record(s) from ${formatDateDisplay(fromDate)} to ${formatDateDisplay(toDate)}.${duplicateText}`;
        reportStatus.style.color = '#4caf50';
      }

      function applyTheme(theme) {
        const normalized = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', normalized);
        if (themeToggleInput) {
          themeToggleInput.checked = normalized === 'dark';
        }
        try {
          localStorage.setItem(THEME_STORAGE_KEY, normalized);
        } catch {
          // Ignore storage failures.
        }
      }

      themeToggleInput.addEventListener('change', () => {
        applyTheme(themeToggleInput.checked ? 'dark' : 'light');
      });

      window.addEventListener('storage', (event) => {
        if (event.key === THEME_STORAGE_KEY) {
          applyTheme(event.newValue === 'dark' ? 'dark' : 'light');
        }
      });

      try {
        const savedTheme = localStorage.getItem(THEME_STORAGE_KEY);
        applyTheme(savedTheme === 'dark' ? 'dark' : 'light');
      } catch {
        applyTheme('light');
      }

      function setPressed(container, selector, isActive) {
        container.querySelectorAll(selector).forEach((button) => {
          const active = isActive(button);
          button.classList.toggle('is-active', active);
          button.setAttribute('aria-pressed', active ? 'true' : 'false');
        });
      }

      function syncControls() {
        [
          [billingReportBtn, activeTab === 'billing'],
          [bookingReportBtn, activeTab === 'booking']
        ].forEach(([button, active]) => {
          button.classList.toggle('btn-primary', active);
          button.classList.toggle('btn-secondary', !active);
          button.setAttribute('aria-selected', active ? 'true' : 'false');
        });
        setPressed(periodChips, '[data-period]', (b) => b.dataset.period === activePeriod);
        setPressed(billModeChips, '[data-mode]', (b) => b.dataset.mode === activeBillingMode);
        billModeChips.hidden = activeTab !== 'billing';
        customRange.hidden = activePeriod !== 'custom';
      }

      function clearReport() {
        reportStats.innerHTML = '';
        bookingReportWrap.style.display = 'none';
        billingReportWrap.style.display = 'none';
        reportToolbar.style.display = 'none';
        bookingReportRange = { from: '', to: '' };
      }

      async function refreshReport() {
        syncControls();
        const run = ++reportRun;
        const { from, to } = periodRange(activePeriod);
        reportStatus.textContent = '';
        if (!from || !to) {
          clearReport();
          periodLabel.textContent = 'Pick a From and To date, then tap Show.';
          return;
        }
        if (from > to) {
          clearReport();
          periodLabel.textContent = '';
          reportStatus.textContent = 'From date cannot be after To date.';
          reportStatus.style.color = '#b42a2a';
          return;
        }
        periodLabel.textContent = prettyRange(from, to);
        renderLoadingStats();
        reportToolbar.style.display = 'none';
        try {
          if (activeTab === 'billing') {
            await loadBillingReport(from, to, activeBillingMode, run);
          } else {
            await loadBookingReport(from, to, run);
          }
        } catch (error) {
          if (run !== reportRun) return;
          reportStats.innerHTML = '';
          reportStatus.textContent = error.message || 'Failed to load report.';
          reportStatus.style.color = '#b42a2a';
          bookingReportWrap.style.display = 'none';
          billingReportWrap.style.display = 'none';
          reportToolbar.style.display = 'none';
        }
      }

      billingReportBtn.addEventListener('click', () => {
        activeTab = 'billing';
        refreshReport();
      });

      bookingReportBtn.addEventListener('click', () => {
        activeTab = 'booking';
        refreshReport();
      });

      periodChips.addEventListener('click', (event) => {
        const button = event.target.closest('[data-period]');
        if (!button) return;
        activePeriod = button.dataset.period;
        if (activePeriod === 'custom') {
          const month = periodRange('month');
          if (!fromDateInput.value) fromDateInput.value = month.from;
          if (!toDateInput.value) toDateInput.value = localDateKey(new Date());
        }
        refreshReport();
      });

      billModeChips.addEventListener('click', (event) => {
        const button = event.target.closest('[data-mode]');
        if (!button) return;
        activeBillingMode = button.dataset.mode;
        refreshReport();
      });

      applyDateRangeBtn.addEventListener('click', refreshReport);

      printBookingReportBtn.addEventListener('click', () => {
        if (!bookingReportRange.from || !bookingReportRange.to) {
          reportStatus.textContent = 'Generate a report first, then print.';
          reportStatus.style.color = '#b42a2a';
          return;
        }
        if (activeReportType === 'billing') {
          printContent.innerHTML = billingReportWrap.innerHTML;
        } else {
          printContent.innerHTML = bookingReportWrap.innerHTML;
        }
        window.print();
      });

      refreshReport();
    </script>
